name: Daily Chai Bot Reel

on:
  schedule:
    # Every day at 12:24 UTC = 5:54 PM India time. The Reel goes live about 10 minutes later.
    - cron: "24 12 * * *"
  workflow_dispatch:
    inputs:
      post_to_instagram:
        description: "Post it to Instagram (untick to only make the video)"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-reel
  cancel-in-progress: false

jobs:
  make:
    name: Write and render the Reel
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core libfribidi0 libraqm0
          pip install -q -r requirements.txt

      - name: Make today's Reel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCRIPT_MODEL: ${{ vars.SCRIPT_MODEL }}
        run: python scripts/make_reel.py

      - name: Save the episode script and history
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add -A episodes queue
          if ! git diff --cached --quiet; then
            git commit -m "Episode script"
            git pull --rebase
            git push
          fi

      - name: Keep a copy of the video (download it from this run's page)
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: site/
          retention-days: 14

      - name: Prepare the public video link
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  publish-link:
    name: Publish the video link
    needs: make
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  post:
    name: Post to Instagram
    needs: publish-link
    if: github.event_name == 'schedule' || inputs.post_to_instagram
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: reel
          path: site/

      - name: Post the Reel
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PUBLIC_BASE_URL: ${{ needs.publish-link.outputs.page_url }}
        run: python scripts/post_reel.py

      - name: Record the post
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add posted.log
          if ! git diff --cached --quiet; then
            git commit -m "Posted a Reel"
            git pull --rebase
            git push
          fi
